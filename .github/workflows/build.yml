name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          grep -v "> Task" build.log | grep -E -A8 "What went wrong|error:" | head -9 | tr "
" " " | sed "s/^/::error::/"; echo
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk algerian-driver.apk
          cp invoice/build/outputs/apk/debug/invoice-debug.apk invoice-checker.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: السائق الجزائري وفاحص الفواتير ${{ github.run_number }}
          files: |
            algerian-driver.apk
            invoice-checker.apk
